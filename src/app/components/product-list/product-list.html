<div class="container my-4">
  <div class="products d-flex overflow-auto">
    <div
      class="product-card"
      *ngFor="let product of paginatedProducts"
    >
      <img [src]="product.image" [alt]="product.name" />
      <h3>{{ product.name }}</h3>
      <p>$ {{ product.price }}</p>
      <button class="btn btn-primary" (click)="addToCart(product)">
        Add to Cart
      </button>
    </div>
  </div>

  <!-- Pagination -->
  <div class="pagination d-flex justify-content-center mt-4">
    <button class="btn btn-outline-secondary me-2" (click)="prevPage()">
      Previous
    </button>
    <span class="align-self-center mx-2">Page {{ currentPage }}</span>
    <button class="btn btn-outline-secondary ms-2" (click)="nextPage()">
      Next
    </button>
  </div>
</div>
